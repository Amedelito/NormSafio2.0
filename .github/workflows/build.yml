name: Build Normsafio
 
on:
  push:
  pull_request:
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar
        run: mvn -B -q package
      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: Normsafio-jar
          path: target/Normsafio-*.jar
 
